name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  # Test d'endurance mémoire du démon (critère d'acceptation 11 de SPEC-V1)
  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build, suite QA & endurance
        working-directory: daemon
        run: |
          npm ci
          npm run build
          node scripts/qa.mjs
          node scripts/endurance.mjs 10

  # Build desktop complet : UI + démon sidecar + coquille Tauri, sur les 3 OS
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Dépendances système Linux (webkit2gtk…)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build démon + binaire sidecar (Node SEA)
        working-directory: daemon
        shell: bash
        run: |
          npm ci
          npm run build
          npm run bundle
          TRIPLE=$(rustc -Vv | grep host | cut -d' ' -f2)
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".exe"; fi
          node scripts/make-sea.mjs "../desktop/src-tauri/binaries/daemon-${TRIPLE}${EXT}"

      - name: Build Tauri (${{ matrix.bundles }})
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundles }}

      - name: Publier les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: koateam-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app/**
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
